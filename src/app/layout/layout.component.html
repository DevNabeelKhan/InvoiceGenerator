

<div class="wrapper">
<app-header></app-header>
<app-side-bar></app-side-bar>
<router-outlet></router-outlet>
<footer class="main-footer">
    <div class="pull-right d-none d-sm-inline-block">
    </div>
    &copy;2025  All Rights Reserved .
</footer>
<!-- Side panel -->
<!-- quick_user_toggle -->
<div class="modal modal-right fade" id="quick_user_toggle" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content slim-scroll3">
            <div class="modal-body p-30 bg-white">
                <div class="d-flex align-items-center justify-content-between pb-30">
                    <h4 class="m-0">User Profile
                   </h4>
                    <a href="#" class="btn btn-icon btn-danger-light btn-sm no-shadow"  id="closerightpopup" data-bs-dismiss="modal">
                        <span class="fa fa-close"></span>
                    </a>
                </div>
                <div>
                    <div class="d-flex flex-row">
                        <div class="">
                            <img [src]="user.pictureUrl" alt="user" class="rounded bg-danger-light w-150" width="100"></div>
                        <div class="ps-20">
                            <h5 class="mb-0">{{user.fullName}} </h5>
                            <p class="my-5 text-fade">{{user.roleTitle}}</p>
                            <a href="mailto:dummy@gmail.com"><span class="icon-Mail-notification me-0 text-success">
                                <span class="path1"></span><span class="path2"></span></span>{{user.email}}</a>
     
                        </div>
                    </div>
                </div>
                <div class="dropdown-divider my-30"></div>
                <div>
                    <div class="d-flex align-items-center mb-30">
                        <div class="me-15 bg-primary-light h-50 w-50 l-h-60 rounded text-center d-flex align-items-center justify-content-center">
                            <span class="icon-Library fs-24"><i class="fa-solid fa-user"></i></span>
                        </div>
                        <div class="d-flex flex-column fw-500">
                            <a href="javascript:;" routerLink="/my-profile" (click)="closePopup()" class="text-dark hover-primary mb-1 fs-16">My Profile</a>
                            <span class="text-fade">Account settings and more</span>
                        </div>
                    </div>
                    <div class="d-flex align-items-center mb-30">
                        <div class="me-15 bg-danger-light h-50 w-50 l-h-60 rounded text-center">
                          <span class="icon-Write fs-24">
                            <img src="../../assets/images/password.png">
                          </span>
                        </div>
                        <div class="d-flex flex-column fw-500">
                          <a href="javascript:;"  (click)="ChangePassword()" class="text-dark hover-danger mb-1 fs-16">Password</a>
                          <span class="text-fade">Change Password</span>
                        </div>
                      </div>
                      <div class="d-flex align-items-center mb-30">
                        <div class="me-15 bg-danger-light h-50 w-50 l-h-60 rounded text-center">
                          <span class="icon-Write fs-24">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                          </span>
                        </div>
                        <div class="d-flex flex-column fw-500">
                          <a href="javascript:;" (click)="Logout()" class="text-dark hover-danger mb-1 fs-16">Logout</a> 
                        </div>
                      
                      </div>
                </div>
                <div class="dropdown-divider my-30"></div>
             
            </div>
        </div>
    </div>
</div>
<!-- /quick_user_toggle -->



<!-- Add the sidebar's background. This div must be placed immediately after the control sidebar -->
<div class="control-sidebar-bg"></div>
</div>
