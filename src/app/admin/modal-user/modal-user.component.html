<h2 mat-dialog-title>Add Update Provider Account</h2>
<mat-dialog-content>
    <div class="row">
        <div class="col-lg-12">
            <form #form="ngForm">
                <div class="box">
                    <div class="box-body">
                        <div class="tab-content" id="pills-tabContent">
                            <div class="tab-pane fade show active" id="pills-1" role="tabpanel"
                                aria-labelledby="pills-1-tab" tabindex="0">
                                <div class="row mt-3 px-3">
                                    
                                    <div class="col-lg-6 col-md-6 mb-2">
                                        <label class="mb-1">Full Name</label>
                                        <div class="form-group">
                                            <input type="text" name="FullName" [(ngModel)]="userModel.FullName"
                                                class="form-control" placeholder="Enter Full Name">
                                        </div>
                                    </div>
                                    <div class="col-lg-6 col-md-6 mb-2">
                                        <label class="mb-1">User Name</label>
                                        <div class="form-group">
                                            <input type="text" name="UserName" [(ngModel)]="userModel.UserName"
                                                class="form-control" placeholder="Enter User Name">
                                        </div>
                                    </div>
                                </div>
                                <div class="row mt-3 px-3">
                                    <div class="col-lg-6 col-md-6 mb-2">
                                        <label class="mb-1">Password</label>
                                        <div class="form-group">
                                            <input type="text" name="Password"
                                                [(ngModel)]="userModel.Password" class="form-control" placeholder="Enter Password">
                                        </div>
                                    </div>
                                    <div class="col-lg-6 col-md-6 mb-2">
                                        <label class="mb-1">Role</label>
                                        <div class="form-group">
                                            <select [(ngModel)]="userModel.RoleId" name="user"
                                                id="RoleId" class="form-select" placeholder="Enter Role">
                                                <option value="">Select Role</option>
                                                <option *ngFor="let item of user" [value]="item.Id">
                                                    {{item.Title}}</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </form>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <div class="div-right">
        <button class="cmp-btn" (click)="onSubmit()">Save</button>
        <button class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    </div>
</mat-dialog-actions>
