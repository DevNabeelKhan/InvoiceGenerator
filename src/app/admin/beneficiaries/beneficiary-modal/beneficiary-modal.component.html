<h2 mat-dialog-title>{{ selectedId ? 'Edit Beneficiary' : 'Add Beneficiary' }}</h2>
<mat-dialog-content>
    <div class="row">
        <div class="col-lg-12">
            <form #form="ngForm">
                <div class="box">
                    <div class="box-body">
                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Beneficiary Name <span class="text-danger">*</span></label>
                                <div class="form-group">
                                    <input type="text" name="BeneficiaryName"
                                        [(ngModel)]="beneficiaryModel.BeneficiaryName" class="form-control"
                                        placeholder="Enter Beneficiary Name" required>
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Beneficiary Address</label>
                                <div class="form-group">
                                    <input type="text" name="BeneficiaryAddress"
                                        [(ngModel)]="beneficiaryModel.BeneficiaryAddress" class="form-control"
                                        placeholder="Enter Beneficiary Address">
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Bank Name</label>
                                <div class="form-group">
                                    <input type="text" name="BankName" [(ngModel)]="beneficiaryModel.BankName"
                                        class="form-control" placeholder="Enter Bank Name">
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Swift</label>
                                <div class="form-group">
                                    <input type="text" name="Swift" [(ngModel)]="beneficiaryModel.Swift"
                                        class="form-control" placeholder="Enter Swift Code">
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">IBAN</label>
                                <div class="form-group">
                                    <input type="text" name="IBAN" [(ngModel)]="beneficiaryModel.IBAN"
                                        class="form-control" placeholder="Enter IBAN">
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-6 mb-2" *ngIf="selectedId">
                                <label class="mb-1">Status</label>
                                <div class="form-group">
                                    <select class="form-select" name="IsActive" [(ngModel)]="beneficiaryModel.IsActive">
                                        <option [ngValue]="true">Active</option>
                                        <option [ngValue]="false">Inactive</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-12 mb-2">
                                <label class="mb-1">Customers</label>
                                <div class="d-flex gap-2">
                                    <select class="form-select" [(ngModel)]="customerToAdd" name="customerToAdd"
                                        (change)="addCustomerFromDropdown()">
                                        <option [ngValue]="null">Select existing customer…</option>
                                        <option *ngFor="let c of availableCustomers" [ngValue]="c.Id">{{ c.CustomerName }}</option>
                                    </select>
                                    <button type="button" class="btn-add-link flex-shrink-0" (click)="openAddCustomer()">
                                        <i class="fa-solid fa-plus"></i> Add Customer
                                    </button>
                                </div>

                                <div class="linked-list mt-2">
                                    <div class="linked-empty" *ngIf="!selectedCustomers.length">
                                        No customers linked yet.
                                    </div>
                                    <div class="linked-card" *ngFor="let c of selectedCustomers">
                                        <div class="linked-card-info">
                                            <div class="linked-card-title">{{ c.CustomerName }}</div>
                                            <div class="linked-card-sub">{{ c.InvoicingEmail }}<span *ngIf="c.InvoicingPhone"> · {{ c.InvoicingPhone }}</span></div>
                                        </div>
                                        <div class="linked-card-actions">
                                            <button type="button" class="icon-btn" (click)="openEditCustomer(c.Id)" title="Edit">
                                                <i class="fa-solid fa-pen"></i>
                                            </button>
                                            <button type="button" class="icon-btn" (click)="unlinkCustomer(c.Id)" title="Unlink">
                                                <i class="fa-solid fa-link-slash"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <div class="div-right">
        <button class="cmp-btn" [disabled]="isSaving" (click)="onSubmit()">{{ isSaving ? 'Saving...' : 'Save' }}</button>
        <button class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    </div>
</mat-dialog-actions>
