<h2 mat-dialog-title>{{ selectedId ? 'Edit Product' : 'Add Product' }}</h2>
<mat-dialog-content>
    <div class="row">
        <div class="col-lg-12">
            <form #form="ngForm">
                <div class="box">
                    <div class="box-body">
                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Product Name <span class="text-danger">*</span></label>
                                <div class="form-group">
                                    <input type="text" name="Title" [(ngModel)]="productModel.Title"
                                        class="form-control" placeholder="Enter Product Name" required>
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Service Code / SKU</label>
                                <div class="form-group">
                                    <input type="text" name="ServiceCode" [(ngModel)]="productModel.ServiceCode"
                                        class="form-control" placeholder="Enter Service Code / SKU">
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-12 mb-2">
                                <label class="mb-1">Description</label>
                                <div class="form-group">
                                    <textarea name="ServiceDescription" [(ngModel)]="productModel.ServiceDescription"
                                        class="form-control" style="height: 80px;"
                                        placeholder="Enter Description"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Selling Price</label>
                                <div class="form-group">
                                    <input type="number" name="SellingPrice" [(ngModel)]="productModel.SellingPrice"
                                        class="form-control" placeholder="Enter Selling Price">
                                </div>
                            </div>
                            <div class="col-lg-6 col-md-6 mb-2">
                                <label class="mb-1">Purchase Cost</label>
                                <div class="form-group">
                                    <input type="number" name="PurchaseCost" [(ngModel)]="productModel.PurchaseCost"
                                        class="form-control" placeholder="Enter Purchase Cost">
                                </div>
                            </div>
                        </div>

                        <div class="row mt-2 px-2">
                            <div class="col-lg-6 col-md-6 mb-2" *ngIf="selectedId">
                                <label class="mb-1">Status</label>
                                <div class="form-group">
                                    <select class="form-select" name="IsActive" [(ngModel)]="productModel.IsActive">
                                        <option [ngValue]="true">Active</option>
                                        <option [ngValue]="false">Inactive</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</mat-dialog-content>
<mat-dialog-actions>
    <div class="div-right">
        <button class="cmp-btn" [disabled]="isSaving" (click)="onSubmit()">{{ isSaving ? 'Saving...' : 'Save' }}</button>
        <button class="btn btn-outline-secondary" (click)="cancel()">Cancel</button>
    </div>
</mat-dialog-actions>
